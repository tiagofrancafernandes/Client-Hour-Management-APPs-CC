# Tiago Apps Docker Compose - Development Environment
# ==============================================
#
# Usage:
#   1. Copy this file to docker-compose.yaml
#   2. Copy .env.docker.example to .env.docker
#   3. Configure your environment variables
#   4. Run: docker compose up -d
#
# For production, use docker-compose.prod.example.yaml
#
# Domains:
#   - hourledger.local.com       -> Landing Page (Nuxt 4)
#   - app.hourledger.local.com   -> Customer Frontend (Vue 3)
#   - admin.hourledger.local.com -> Backoffice (Nuxt 4)
#   - api.hourledger.local.com   -> API (Laravel)

name: tiagoapps

services:
    # ===========================================
    # Infrastructure Services
    # ===========================================

    # Nginx Reverse Proxy
    nginx:
        image: nginx:alpine
        container_name: tiagoapps-nginx
        restart: unless-stopped
        ports:
            - '${NGINX_HTTP_PORT:-80}:80'
            - '${NGINX_HTTPS_PORT:-443}:443'
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
            - ./docker/nginx/landingpage.conf:/etc/nginx/conf.d/landingpage.conf:ro
            - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/frontend.conf:ro
            - ./docker/nginx/backoffice.conf:/etc/nginx/conf.d/backoffice.conf:ro
            - ./backend:/var/www/html/backend:ro
            - nginx-logs:/var/log/nginx
            # Uncomment to use custom hosts file
            # - ./docker/infra/etc-hosts:/etc/hosts:ro
        depends_on:
            - backend
            - frontend
            - landingpage
            - backoffice
        networks:
            tiagoapps-network:
                aliases:
                    - hourledger.local.com
                    - app.hourledger.local.com
                    - admin.hourledger.local.com
                    - api.hourledger.local.com
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # PostgreSQL Database
    postgres:
        image: postgres:16-alpine
        container_name: tiagoapps-postgres
        restart: unless-stopped
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-tiagoapps}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f2apps_secret}
            POSTGRES_DB: ${POSTGRES_DB:-tiagoapps}
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        networks:
            - tiagoapps-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tiagoapps} -d ${POSTGRES_DB:-tiagoapps}']
            interval: 10s
            timeout: 5s
            retries: 5

    # Redis Cache
    redis:
        image: redis:7-alpine
        container_name: tiagoapps-redis
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-6379}:6379'
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-f2apps_redis}
        volumes:
            - redis-data:/data
        networks:
            - tiagoapps-network
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-f2apps_redis}', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    # ===========================================
    # Application Services
    # ===========================================

    # Laravel Backend API
    backend:
        build:
            context: .
            dockerfile: ./docker/laravel/Dockerfile.dev
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        container_name: tiagoapps-backend
        restart: unless-stopped
        working_dir: /var/www/html/backend
        volumes:
            - ./backend:/var/www/html/backend
            - php-logs:/var/log/php
            # Uncomment to use custom hosts file
            # - ./docker/infra/etc-hosts:/etc/hosts:ro
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}
            APP_URL: http://api.hourledger.local.com
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB:-tiagoapps}
            DB_USERNAME: ${POSTGRES_USER:-tiagoapps}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-f2apps_secret}
            REDIS_HOST: redis
            REDIS_PASSWORD: ${REDIS_PASSWORD:-f2apps_redis}
            REDIS_PORT: 6379
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
            # Domain environment variables
            SAAS_DOMAIN: hourledger.local.com
            CUSTOMER_APP_DOMAIN: app.hourledger.local.com
            BACKOFFICE_DOMAIN: admin.hourledger.local.com
            API_DOMAIN: api.hourledger.local.com
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - tiagoapps-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # Vue 3 Customer Frontend
    frontend:
        build:
            context: .
            dockerfile: ./docker/node/Dockerfile.vue.dev
        container_name: tiagoapps-frontend
        restart: unless-stopped
        working_dir: /app
        ports:
            - '${FRONTEND_PORT:-5173}:5173'
        volumes:
            - ./frontend:/app
            - /app/node_modules
            # Uncomment to use custom hosts file
            # - ./docker/infra/etc-hosts:/etc/hosts:ro
        environment:
            NODE_ENV: development
            VITE_API_URL: http://api.hourledger.local.com
            VITE_APP_URL: http://app.hourledger.local.com
            # Domain environment variables
            VITE_SAAS_DOMAIN: hourledger.local.com
            VITE_CUSTOMER_APP_DOMAIN: app.hourledger.local.com
            VITE_BACKOFFICE_DOMAIN: admin.hourledger.local.com
            VITE_API_DOMAIN: api.hourledger.local.com
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - tiagoapps-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # Nuxt 4 Landing Page
    landingpage:
        build:
            context: .
            dockerfile: ./docker/node/Dockerfile.nuxt.dev
        container_name: tiagoapps-landingpage
        restart: unless-stopped
        working_dir: /app
        ports:
            - '${LANDINGPAGE_PORT:-3000}:3000'
        volumes:
            - ./landingpage:/app
            - /app/node_modules
            # Uncomment to use custom hosts file
            # - ./docker/infra/etc-hosts:/etc/hosts:ro
        environment:
            NODE_ENV: development
            NUXT_PUBLIC_API_URL: http://api.hourledger.local.com
            NUXT_PUBLIC_APP_URL: http://hourledger.local.com
            # Domain environment variables
            NUXT_PUBLIC_SAAS_DOMAIN: hourledger.local.com
            NUXT_PUBLIC_CUSTOMER_APP_DOMAIN: app.hourledger.local.com
            NUXT_PUBLIC_BACKOFFICE_DOMAIN: admin.hourledger.local.com
            NUXT_PUBLIC_API_DOMAIN: api.hourledger.local.com
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - tiagoapps-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # Nuxt 4 Backoffice
    backoffice:
        build:
            context: .
            dockerfile: ./docker/node/Dockerfile.nuxt.dev
        container_name: tiagoapps-backoffice
        restart: unless-stopped
        working_dir: /app
        ports:
            - '${BACKOFFICE_PORT:-3001}:3000'
        volumes:
            - ./frontend-backoffice:/app
            - /app/node_modules
            # Uncomment to use custom hosts file
            # - ./docker/infra/etc-hosts:/etc/hosts:ro
        environment:
            NODE_ENV: development
            NUXT_PUBLIC_API_URL: http://api.hourledger.local.com
            NUXT_PUBLIC_APP_URL: http://admin.hourledger.local.com
            # Domain environment variables
            NUXT_PUBLIC_SAAS_DOMAIN: hourledger.local.com
            NUXT_PUBLIC_CUSTOMER_APP_DOMAIN: app.hourledger.local.com
            NUXT_PUBLIC_BACKOFFICE_DOMAIN: admin.hourledger.local.com
            NUXT_PUBLIC_API_DOMAIN: api.hourledger.local.com
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - tiagoapps-network
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # ===========================================
    # Development Tools (Optional)
    # ===========================================

    # Laravel Queue Worker
    queue-worker:
        build:
            context: .
            dockerfile: ./docker/laravel/Dockerfile.dev
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        container_name: tiagoapps-queue-worker
        restart: unless-stopped
        working_dir: /var/www/html/backend
        volumes:
            - ./backend:/var/www/html/backend
        environment:
            APP_ENV: ${APP_ENV:-local}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB:-tiagoapps}
            DB_USERNAME: ${POSTGRES_USER:-tiagoapps}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-f2apps_secret}
            REDIS_HOST: redis
            REDIS_PASSWORD: ${REDIS_PASSWORD:-f2apps_redis}
            REDIS_PORT: 6379
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        depends_on:
            - backend
            - redis
        networks:
            - tiagoapps-network
        profiles:
            - workers

    # Laravel Scheduler
    scheduler:
        build:
            context: .
            dockerfile: ./docker/laravel/Dockerfile.dev
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        container_name: tiagoapps-scheduler
        restart: unless-stopped
        working_dir: /var/www/html/backend
        volumes:
            - ./backend:/var/www/html/backend
        environment:
            APP_ENV: ${APP_ENV:-local}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${POSTGRES_DB:-tiagoapps}
            DB_USERNAME: ${POSTGRES_USER:-tiagoapps}
            DB_PASSWORD: ${POSTGRES_PASSWORD:-f2apps_secret}
            REDIS_HOST: redis
            REDIS_PASSWORD: ${REDIS_PASSWORD:-f2apps_redis}
            REDIS_PORT: 6379
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
        depends_on:
            - backend
        networks:
            - tiagoapps-network
        profiles:
            - workers

# ===========================================
# Networks
# ===========================================
networks:
    tiagoapps-network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.28.0.0/16

# ===========================================
# Volumes
# ===========================================
volumes:
    postgres-data:
        driver: local
    redis-data:
        driver: local
    nginx-logs:
        driver: local
    php-logs:
        driver: local
